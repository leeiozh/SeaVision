name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# ─────────────────────────────────────────────────────────────────────────────
# ЕДИНАЯ сборка для Windows 7 / 8.1 / 10 / 11.
#
# Раньше линий было две (Python 3.12 для Win10/11 + Python 3.8 для Win7) —
# четыре артефакта, и легко было увезти на объект не тот. Теперь одна:
# бинарники Python 3.8 совместимы вверх и запускаются на всех Windows от 7 до 11,
# тогда как сборка на 3.9+ на семёрке не стартует в принципе (PssQuerySnapshot —
# прямой импорт из kernel32, KnownDLL, шимом не подменяется). Поэтому пока Win7
# в списке целевых систем, единая сборка возможна только на 3.8 + PyInstaller 5.
#
# Артефакта два — по назначению, не по ОС:
#   seavision-windows-x64        — штатная, БЕЗ matplotlib (pics=false)
#   seavision-windows-x64-debug  — С matplotlib (pics=<путь>, debug-картинки)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win-debug.txt
          pip install "pyinstaller==5.13.2"

      - name: Build EXE (no matplotlib)
        run: pyinstaller seavision-win.spec --distpath dist --workpath build

      - name: Build EXE (debug, with matplotlib)
        run: pyinstaller seavision-win-debug.spec --distpath dist-debug --workpath build-debug

      # Тесты гоняем на ТОМ ЖЕ Python 3.8, на котором собран бандл: часть ошибок
      # видна только здесь (socket.timeout не является TimeoutError до 3.10).
      - name: Run tests on Python 3.8
        run: |
          python test/test_config_encoding.py
          python test/test_idle_no_error.py
          python test/test_error_heartbeat.py

      # Дым-тест на самом раннере (ядро Win10/11): бандл должен реально стартовать,
      # а не только собраться. config.ini слушает 127.0.0.1, радар не нужен —
      # процессор уходит в «ожидание данных» и обязан ЖДАТЬ МОЛЧА.
      # Ловит два класса поломок, невидимых на этапе сборки:
      #   * падение старта (несовместимые DLL, битые импорты numpy/scipy);
      #   * шум в штатном простое (напр. socket.timeout мимо except TimeoutError).
      # 45 с не случайны: overall_timeout в get_bck = 30 с, т.е. окно должно
      # пережить хотя бы один полный цикл ожидания.
      - name: Smoke test (Win10/11 kernel)
        shell: pwsh
        run: |
          foreach ($d in 'dist', 'dist-debug') {
            Write-Host "=== smoke: $d ==="
            Copy-Item config.ini "$d/seavision/config.ini" -Force
            $log = "$d-smoke.log"
            $err = "$d-smoke.err"
            $p = Start-Process -FilePath "$d/seavision/seavision.exe" `
                               -WorkingDirectory "$d/seavision" `
                               -RedirectStandardOutput $log `
                               -RedirectStandardError $err `
                               -PassThru -NoNewWindow
            Start-Sleep -Seconds 45
            $exited = $p.HasExited
            if (-not $exited) { Stop-Process -Id $p.Id -Force }
            $out = (Get-Content $log -Raw -ErrorAction SilentlyContinue) + `
                   (Get-Content $err -Raw -ErrorAction SilentlyContinue)
            Write-Host $out
            if ($exited) {
              Write-Error "$d : процесс завершился с кодом $($p.ExitCode), ожидалась работа"
              exit 1
            }
            if ($out -notmatch 'Manager started') {
              Write-Error "$d : в выводе нет 'Manager started'"
              exit 1
            }
            if ($out -match 'Input error|Traceback') {
              Write-Error "$d : простой без данных должен быть молчаливым, а в выводе есть ошибка"
              exit 1
            }
            Write-Host "$d : OK — стартовал, жив через 45 с, простой молчаливый"
          }

      # Диагностика: какие системные DLL уехали в бандл. Полезно при разборе
      # «на одной машине работает, на другой нет» — сверять состав UCRT.
      - name: List bundled system DLLs
        shell: pwsh
        run: |
          Get-ChildItem dist/seavision -Filter '*.dll' |
            Where-Object { $_.Name -match '(?i)^(api-ms-|ucrtbase|vcruntime|msvcp|concrt)' } |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seavision-windows-x64
          path: dist/seavision/             # штатная сборка, без matplotlib
          retention-days: 30

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: seavision-windows-x64-debug
          path: dist-debug/seavision/       # debug-сборка с matplotlib (pics=<путь>)
          retention-days: 30
