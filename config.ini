[input]
type = udp
back_port = 4001
navi_port = 4002
my_ip = 127.0.0.1

[output]
udp = true
file = false
pics = false
protocol = new
server_ip = 127.0.0.1
server_port = 4000
server_ip2   = 127.0.0.1
server_port2 = 4003
out_times = 14

[pipeline]
# Глубина очереди Input→Process в кадрах. Должна перекрывать самый долгий расчёт
# спектра: пока он идёт, кадры продолжают приходить (по одному за оборот, ~2.4 с
# при RPM=25), и при нехватке слотов обороты теряются — в ряде появляется дыра.
# Цена слота ~8.5 МБ (кадр 4096×2048 uint8), т.е. 16 ≈ 135 МБ ОЗУ.
# Если в логе есть "Input queue full" — там же напечатано, сколько нужно.
queue_size = 16
restart_on_error = true

[hardware]
installation_id = default
AREA_AZIM_PX = 4096
AREA_READ_DIST_PX = 2048
AREA_DISTANCE_PX = 1192
AREA_SIZE_PX = 192
RPM = auto

[calibration]
SNR_A = 44
SNR_B = 28
WSPD_A = 300
WSPD_B = 45
WIND_SIG_MIN = 5.5

[processing]
N_SHOTS = 256
MEAN    = 4
